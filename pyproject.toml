[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yolo-studio"
version = "0.1.0"
description = "Local YOLO computer vision with browser and desktop interfaces"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["playwright>=1.55,<2", "httpx>=0.28,<1", "ruff==0.17.1", "pre-commit==4.7.0"]

[project.scripts]
yolo-studio = "yolo_studio.cli.server:main"
yolo-webcam = "yolo_studio.cli.desktop:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
"yolo_studio.web" = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", ".venv-system", "runtime", "node_modules", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
